name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Los secretos viven en el entorno "BORAHAE SECRETS": un entorno-deploy
    # secret solo llega al job si este declara el entorno aquí. Sin esto,
    # el build de CI no ve PAYLOAD_SECRET/DATABASE_URL y falla.
    environment: BORAHAE SECRETS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - name: Setup Node for Payload
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias (bloqueo reproducible)
        run: pnpm install --frozen-lockfile

      - name: Generar tipos de rutas (next typegen)
        run: npx next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        # Fase 4, decisión (a): las páginas se prerenderizan en build leyendo
        # de Payload/PostgreSQL. Requiere secret del repo (dev y main):
        #   DATABASE_URL   → endpoint **pooled** de Neon (branch del entorno)
        #   PAYLOAD_SECRET → mismo valor que en Vercel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Impeccable detect (exit 2 = hallazgos AI-slop, falla)
        run: npx impeccable detect --github src/
